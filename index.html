<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1x1 Sliding Folders</title>
    <style>
        /* Sets the background image and centers everything */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            
            /* ========================================== */
            /* PUT YOUR BACKGROUND IMAGE LINK/FILE BELOW  */
            /* ========================================== */
            background-image: url('gri.jpg'); 
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: black; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden; /* Prevents scrollbars */
        }

        /* Styles the waving button */
        .wave-button {
            background: linear-gradient(45deg, #FF69B4, #FF1493);
            color: white;
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
            animation: wave-animation 2.5s infinite;
            transition: all 0.3s ease;
        }

        .wave-button:hover {
            transform: scale(1.1) !important;
            box-shadow: 0 0 40px rgba(255, 105, 180, 1);
            animation-play-state: paused;
        }

        @keyframes wave-animation {
            0%   { transform: rotate(0deg); }
            10%  { transform: rotate(15deg) translateY(-5px); }
            20%  { transform: rotate(-10deg) translateY(0px); }
            30%  { transform: rotate(10deg) translateY(-5px); }
            40%  { transform: rotate(-5deg) translateY(0px); }
            50%  { transform: rotate(0deg); }
            100% { transform: rotate(0deg); }
        }

        /* Slider Container Styles */
        #slider-container {
            display: none; 
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.6); 
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-btn {
            background: rgba(255, 105, 180, 0.3);
            color: white;
            border: 2px solid #FF69B4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #FF69B4;
            box-shadow: 0 0 15px #FF1493;
            transform: scale(1.1);
        }

        #slider-window {
            width: 250px; 
            overflow: hidden; 
            border-radius: 15px;
        }

        #slider-track {
            display: flex;
            transition: transform 0.4s ease-in-out; 
            width: 100%;
        }

        .slide-item {
            min-width: 100%; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .folder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 105, 180, 0.15);
            border: 2px solid #FF69B4;
            border-radius: 15px;
            padding: 20px;
            width: 160px; 
            height: 160px; 
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .folder:hover {
            background: #FF69B4;
            box-shadow: 0 0 20px #FF1493;
            transform: translateY(-8px);
        }

        .folder-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .folder-name {
            font-size: 16px; 
            font-weight: bold;
            color: white;
            text-align: center;
            line-height: 1.2;
        }

        /* Password Section Styles */
        #password-section {
            display: none; 
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.5s ease;
            
            background: rgba(0, 0, 0, 0.8); 
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #password-section h3 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #FF69B4;
        }

        input[type="password"] {
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 25px;
            border: 2px solid #FF69B4; 
            background-color: rgba(0, 0, 0, 0.5); 
            color: white;
            outline: none;
            text-align: center;
            transition: box-shadow 0.3s ease;
            width: 200px;
        }

        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input[type="password"]:focus {
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .submit-btn {
            background: #FF69B4;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #FF1493; 
            box-shadow: 0 0 15px #FF1493;
        }

        .back-btn {
            background: #555;
            border: 2px solid #555;
        }

        .back-btn:hover {
            background: #777;
            box-shadow: 0 0 15px #777;
        }

        #error-msg {
            color: #ff4d4d;
            font-size: 15px;
            display: none; 
            margin: 0;
        }

        /* ========================================= */
        /* LOADING SCREEN STYLES                     */
        /* ========================================= */
        #loading-screen {
            display: none; /* Hidden initially */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.5s ease;
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.6; /* Dims the video slightly so text is readable */
        }

        .loading-text {
            font-size: 40px;
            font-weight: bold;
            color: #FF69B4;
            text-shadow: 0 0 20px #FF1493, 0 0 40px #FF1493;
            letter-spacing: 3px;
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 30px #FF1493, 0 0 60px #FF1493; }
            100% { transform: scale(1); opacity: 0.8; }
        }

    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="congga.mp3" type="audio/mpeg">
    </audio>

    <!-- Initial Waving Button -->
    <button id="main-button" class="wave-button" onclick="showFolders()">Click Me</button>

    <!-- 1x1 Folder Slider Container -->
    <div id="slider-container">
        <!-- Left Arrow -->
        <button class="nav-btn" onclick="slideFolder(-1)">&#10094;</button>

        <div id="slider-window">
            <div id="slider-track">
                <!-- Folder 1: Bioet -->
                <div class="slide-item">
                    <div class="folder" onclick="requirePassword('https://drive.google.com/drive/folders/1HWqLAePHZt6SLb-IMBc7Qg2fmR3hmy76')">
                        <div class="folder-icon">📁</div>
                        <div class="folder-name">Bioet</div>
                    </div>
                </div>

                <!-- Folder 2: Nutrition -->
                <div class="slide-item">
                    <div class="folder" onclick="requirePassword('https://drive.google.com/drive/folders/1jjnpAvcwzldYJDSyjCYtfFN0ry9ZSdjw')">
                        <div class="folder-icon">📁</div>
                        <div class="folder-name">Nutrition</div>
                    </div>
                </div>

                <!-- Folder 3: Health Nursing -->
                <div class="slide-item">
                    <div class="folder" onclick="requirePassword('https://drive.google.com/drive/folders/13zk1TTZBlRyt13QcP0Z9H6c3CH0NlrUw')">
                        <div class="folder-icon">📁</div>
                        <div class="folder-name">Health Nursing</div>
                    </div>
                </div>

                <!-- Folder 4: Pharmacology -->
                <div class="slide-item">
                    <div class="folder" onclick="requirePassword('https://drive.google.com/drive/folders/1KxC5Tx8uVGZ3isYQwQb3swKQr-O5DYqj')">
                        <div class="folder-icon">📁</div>
                        <div class="folder-name">Pharmacology</div>
                    </div>
                </div>

                <!-- Folder 5: Care of Mother, child, and adolescent -->
                <div class="slide-item">
                    <div class="folder" onclick="requirePassword('https://drive.google.com/drive/folders/14loo4GrvIxoeRnWx5nGPwzQRmhac99nq')">
                        <div class="folder-icon">📁</div>
                        <div class="folder-name">Care of Mother, child, and adolescent</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Arrow -->
        <button class="nav-btn" onclick="slideFolder(1)">&#10095;</button>
    </div>

    <!-- Password Input Section -->
    <div id="password-section">
        <h3> >_< </h3>
        <input type="password" id="password-input" placeholder="Type 'plsmaster'">
        
        <div class="button-group">
            <button class="submit-btn" onclick="checkPassword()">Unlock</button>
            <button class="submit-btn back-btn" onclick="goBackToFolders()">Back</button>
        </div>

        <p id="error-msg">Incorrect password. Try again.</p>
    </div>

    <!-- ========================================== -->
    <!-- LOADING SCREEN SECTION                     -->
    <!-- ========================================== -->
    <div id="loading-screen">
        
        <!-- REMOVED 'muted' and 'autoplay' SO THE VIDEO CAN PLAY WITH SOUND -->
        <video id="bg-video" loop playsinline>
            <source src="kpop.mp4" type="video/mp4">
        </video>

        <!-- Animated Text -->
        <div class="loading-text">PLEASE WAIT...</div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentLinkToOpen = "";
        let currentSlideIndex = 0;

        function showFolders() {
            var music = document.getElementById('bg-music');
            music.play().catch(function(error) {
                console.log("Music play blocked by browser:", error);
            });

            document.getElementById('main-button').style.display = 'none';
            document.getElementById('slider-container').style.display = 'flex';
        }

        function slideFolder(direction) {
            const track = document.getElementById('slider-track');
            const totalSlides = document.querySelectorAll('.slide-item').length;

            currentSlideIndex += direction;

            if (currentSlideIndex < 0) {
                currentSlideIndex = totalSlides - 1;
            } else if (currentSlideIndex >= totalSlides) {
                currentSlideIndex = 0;
            }

            track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
        }

        function requirePassword(link) {
            currentLinkToOpen = link;
            
            document.getElementById('slider-container').style.display = 'none';
            document.getElementById('password-section').style.display = 'flex';
            
            document.getElementById('password-input').value = "";
            document.getElementById('error-msg').style.display = "none";
            document.getElementById('password-input').focus();
        }

        function checkPassword() {
            var enteredPassword = document.getElementById('password-input').value;
            var errorMessage = document.getElementById('error-msg');
            
            if (enteredPassword === "plsmaster") {
                // HIDE PASSWORD SECTION
                document.getElementById('password-section').style.display = 'none';
                errorMessage.style.display = "none";
                
                // STOP THE BACKGROUND MUSIC
                var bgMusic = document.getElementById('bg-music');
                bgMusic.pause();
                
                // SHOW LOADING SCREEN
                var loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.display = 'flex';
                
                // PLAY THE LOADING VIDEO (with sound!)
                var loadVideo = document.getElementById('bg-video');
                loadVideo.currentTime = 0; // Starts the video from the beginning
                loadVideo.play().catch(e => console.log("Video auto-play blocked"));

                // WAIT 18 SECONDS (18000 milliseconds)
                setTimeout(function() {
                    // Redirects the user to the link
                    window.location.href = currentLinkToOpen;
                    
                    // Resets the screen in case they press the browser's "Back" button
                    loadingScreen.style.display = 'none';
                    document.getElementById('slider-container').style.display = 'flex';
                    document.getElementById('password-input').value = "";
                    
                    // Stop the video and restart the background music if they come back
                    loadVideo.pause();
                    bgMusic.play();
                }, 18000); 

            } else {
                // Wrong password
                errorMessage.style.display = "block";
                document.getElementById('password-input').value = ""; 
                document.getElementById('password-input').focus();
            }
        }

        function goBackToFolders() {
            document.getElementById('password-section').style.display = 'none';
            document.getElementById('slider-container').style.display = 'flex';
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
